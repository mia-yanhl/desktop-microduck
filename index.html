<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>html body .stats .stat .v{white-space:nowrap}@media (max-width:560px){html body .stats{flex-wrap:wrap!important;gap:2px 14px!important}html body .stats .stat .v{font-size:16px!important}}</style>

<script>for (const el of [...document.body.querySelectorAll('style')]) document.head.appendChild(el);</script><script>
/* ============================================================
   Colorfigures core: projection, shapes, shading, ink, labels, page shell.
   A figure page includes this file (scripts/build.py inlines it), then calls mountFigure({...}).
   See SKILL.md for the drawing contract and conventions.
   One fixed view (front-left-top) and one fixed light (from above, behind the viewer's right shoulder: the front is lit,
   the left side is in shade, and cast shadows fall toward the lower left of the screen).
   ============================================================ */

/* ---------- palettes ---------- */
const PALS = {
  mustard: { l:'#f4b829', m:'#d49c1f', d:'#4e4a18' },
  tomato:  { l:'#ef6a4c', m:'#cf5038', d:'#4a2219' },
  mint:    { l:'#93d3b0', m:'#71b693', d:'#1f4034' },
  cobalt:  { l:'#76a0e2', m:'#5a82c6', d:'#1c2948' },
  blush:   { l:'#f3a6bb', m:'#d8869c', d:'#4b2430' },
};
const METAL   = { l:'#eef0f0', m:'#c6ccce', d:'#8f989b' };
const CLEAR   = { l:'#e4f2f4', m:'#c4dfe4', d:'#97b9c0' };
const CERAMIC = { l:'#fbfaf3', m:'#e3e0d2', d:'#bdb8a6' };
const DARK    = { l:'#55504a', m:'#3d3935', d:'#272421' };
const INK = '#231e16';
const SHADOW = '#41538f';

/* ---------- projection (x = depth toward viewer-right, y = toward viewer-left, z = up) ---------- */
const C = Math.cos(Math.PI/6), S = Math.sin(Math.PI/6);
let OX = 0, OY = 0;
/* Free orthographic camera (internal names start with CAM_ / cam so they never clash with a figure's own names). YAW turns the viewer around the vertical axis (45° = the classic front-left view),
   PITCH is how far it looks down (35.26° = true isometric). At the defaults P() is exactly the old isometric
   projection, so every figure drawn for it still lines up. Drag the figure to orbit; double-click to reset.
   rotV(n) maps a world direction into the default view's frame, so vis / tone / any "sum of rotV > 0" test keep
   working at every angle: the viewer is always (1,1,1) and the light stays put relative to the viewer. */
let VIEW = 0, RC = [0, 0], RCZ = 0;
const VIEW_NAMES = ['front', 'left side', 'back', 'right side'];
const TURNS = [0, 2];
const YAW0 = 45, PITCH0 = Math.atan(1/Math.SQRT2) * 180/Math.PI, CAM_K = Math.sqrt(1.5);
let YAW = YAW0, PITCH = PITCH0, CAM_R, CAM_U, CAM_V, CAM_D;                       // right, up, toward viewer, screen-down
const camBasis = (yaw, pitch) => { const t = yaw*Math.PI/180, p = pitch*Math.PI/180, ct = Math.cos(t), st = Math.sin(t), cp = Math.cos(p), sp2 = Math.sin(p);
  return { R:[st,-ct,0], U:[-sp2*ct,-sp2*st,cp], V:[cp*ct,cp*st,sp2] }; };
const CAM_B0 = camBasis(YAW0, PITCH0);
// CAM_LIM: how far (deg) the camera may turn either side of the front view; null = all the way round (set per figure)
let CAM_LIM = null;
function setCam(yaw, pitch){ YAW = CAM_LIM == null ? yaw : Math.max(YAW0 - CAM_LIM, Math.min(YAW0 + CAM_LIM, yaw));
  PITCH = CAM_LIM == null ? Math.max(6, Math.min(78, pitch)) : Math.max(15, Math.min(62, pitch)); const b = camBasis(YAW, PITCH); CAM_R = b.R; CAM_U = b.U; CAM_V = b.V; CAM_D = CAM_U.map(v => -v); }
setCam(YAW0, PITCH0);
const camDot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const rotV = n => { const r = camDot(n,CAM_R), u = camDot(n,CAM_U), v = camDot(n,CAM_V); return [0,1,2].map(i => CAM_B0.R[i]*r + CAM_B0.U[i]*u + CAM_B0.V[i]*v); };
// the light's ground direction turns with the viewer's yaw only (shadows always fall toward the lower left of the screen)
const yawTurn = ([x,y]) => { const t = (YAW - YAW0)*Math.PI/180, c = Math.cos(t), s = Math.sin(t); return [x*c - y*s, x*s + y*c]; };
const rotXY = (x,y) => [x, y];                                                // kept for old callers
const P0 = (x,y,z) => [(x-y)*C + OX, (x+y)*S - z + OY];                       // raw iso
const P  = (x,y,z) => { const q = [x-RC[0], y-RC[1], z-RCZ];
  return [CAM_K*camDot(q,CAM_R) + (RC[0]-RC[1])*C + OX, CAM_K*camDot(q,CAM_D) + (RC[0]+RC[1])*S - RCZ + OY]; };
const Dv = (x,y,z) => [CAM_K*camDot([x,y,z],CAM_R), CAM_K*camDot([x,y,z],CAM_D)];
// distance toward the viewer: draw parts with smaller depth first
const depthOf = p => camDot(p, CAM_V);
// sort [{at:[x,y,z], svg}] back-to-front for the current camera. A part may also give box:[[x0,y0,z0],[x1,y1,z1]]:
// when two boxes are separated along x, y or z, the one on the viewer's side goes last (a centre point alone gets long
// or wrapping parts wrong: a pole beside a row of keys, a spout reaching past a cup).
const boxMid = b => [0,1,2].map(k => (b[0][k] + b[1][k]) / 2);
const sepOrder = (p, q) => { if (!p.box || !q.box) return 0;
  for (let k = 0; k < 3; k++){ if (p.box[1][k] <= q.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? -1 : 1; if (q.box[1][k] <= p.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? 1 : -1; }
  return 0; };
const byDepth = parts => parts.filter(Boolean).sort((p,q) => sepOrder(p,q) || (depthOf(p.at || boxMid(p.box)) - depthOf(q.at || boxMid(q.box)))).map(p => p.svg).join('');
// the half of a vertical ring that faces the viewer / is turned away, as [from, to] angles in degrees (0 = +x, 90 = +y)
const nearHalf = () => [YAW - 90, YAW + 90], farHalf = () => [YAW + 90, YAW + 270];
// an open container (cup, bin, cone, drum) between two rings: far inner wall, then its contents, then the near outer wall
const openShell = (A, B, colour, contents = '') => loft(A, B, colour, true) + contents + loft(A, B, colour);
const f  = v => v.toFixed(1);
const pd = (pts, close=true) => 'M' + pts.map(p => { const q = P(p[0],p[1],p[2]); return f(q[0])+' '+f(q[1]); }).join('L') + (close ? 'Z' : '');
const sp = pts => 'M' + pts.map(q => f(q[0])+' '+f(q[1])).join('L') + 'Z';

/* ---------- 2D shapes in a plane's (u,v) coords (v up), mapped to 3D by a plane ---------- */
const arcUV  = (cu,cv,r,a0,a1,n=7) => { const o=[]; for (let i=0;i<=n;i++){ const a=(a0+(a1-a0)*i/n)*Math.PI/180; o.push([cu+r*Math.cos(a), cv+r*Math.sin(a)]); } return o; };
const rrUV   = (u0,v0,u1,v1,r,n=7) => r <= 0 ? rectUV(u0,v0,u1,v1) : [...arcUV(u1-r,v0+r,r,-90,0,n), ...arcUV(u1-r,v1-r,r,0,90,n), ...arcUV(u0+r,v1-r,r,90,180,n), ...arcUV(u0+r,v0+r,r,180,270,n)];
const rectUV = (u0,v0,u1,v1) => [[u0,v0],[u1,v0],[u1,v1],[u0,v1]];
const ellUV  = (cu,cv,ru,rv,n=24) => Array.from({length:n}, (_,i) => { const a=i/n*2*Math.PI; return [cu+ru*Math.cos(a), cv+rv*Math.sin(a)]; });
const PX = x => ([u,v]) => [x,u,v];      // front-facing plane x = const   (u = y, v = z)
const PY = y => ([u,v]) => [u,y,v];      // side plane y = const           (u = x, v = z)
const PZ = z => ([u,v]) => [u,v,z];      // horizontal plane z = const     (u = x, v = y)
const on = (plane, uv) => uv.map(plane);

/* ---------- vectors + shading ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm=a=>{ const l=Math.hypot(...a)||1; return a.map(v=>v/l); };
const avg=ps=>ps.reduce((s,p)=>[s[0]+p[0]/ps.length,s[1]+p[1]/ps.length,s[2]+p[2]/ps.length],[0,0,0]);
const vis = n => { const r = rotV(n); return r[0]+r[1]+r[2] > 1e-6; };   // viewer looks from (+1,+1,+1) after the turn
const facing = vis;                                                       // readable alias: is this face toward the viewer?
const SHADOW_K = 0.85, AZ_MIN = 20, AZ_MAX = 160;
// cast shadows are drawn shorter than the shading light implies (0.45 × height instead of 0.85 ×): long shadows of tall
// parts on thin supports (a lamp shade, a fan head) land far from the object and read as separate blobs
const SHADOW_LEN = 0.45;
let L = [0,0,1], SH = [0,0];
function setLight(deg){ const a=deg*Math.PI/180; SH=[SHADOW_K*Math.cos(a), SHADOW_K*Math.sin(a)]; L=norm([-SH[0],-SH[1],1]); }
const LIN = norm([.6,.2,1]);                       // fixed light for interiors / small props
// Three flat tones, but blended across a narrow band at each step, so a face that turns past a threshold while the
// figure rotates fades between tones instead of snapping (at rest almost every face still sits on a pure tone).
const SOFT = .18;
const step3 = (d, hi, lo, m) => { const ss = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a)/(b - a))); return k*k*(3 - 2*k); };
  const a = ss(hi - SOFT, hi + SOFT, d), b = ss(lo - SOFT, lo + SOFT, d);
  return a >= 1 ? m.l : b <= 0 ? m.d : a > 0 ? mix(m.m, m.l, a) : b < 1 ? mix(m.d, m.m, b) : m.m; };
const tone  = (n,m) => step3(dot(rotV(n),L),   -.15, -.45, m);   // exterior, follows the sun
const toneI = (n,m) => step3(dot(rotV(n),LIN),  .6,   .05, m);   // interior / props
const mix = (a,b,t) => '#' + [1,3,5].map(i => Math.round(parseInt(a.substr(i,2),16)*(1-t) + parseInt(b.substr(i,2),16)*t).toString(16).padStart(2,'0')).join('');
const matOf = hex => ({ l:hex, m:mix(hex,'#000000',.16), d:mix(hex,'#000000',.42) });
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

/* ---------- drawing primitives (all return SVG strings) ---------- */
const ink   = (d,w=1.0) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
const fill  = (d,c,extra='') => `<path d="${d}" fill="${c}" ${extra}/>`;
const face  = (d,c) => `<path d="${d}" fill="${c}" stroke="${c}" stroke-width=".7" stroke-linejoin="round"/>`;
const shape = (pts,c,w=.9) => fill(pd(pts),c) + (w ? ink(pd(pts),w) : '');
const line  = (pts,w=.9) => ink(pd(pts,false),w);
// Loft between two rings of equal length (closed). colour(n) picks each strip's fill; flip = seen from inside.
function loft(A, B, colour, flip=false){
  const n=A.length, cen=avg(A.concat(B)); let s='';
  for (let i=0;i<n;i++){
    const a0=A[i], a1=A[(i+1)%n], b1=B[(i+1)%n], b0=B[i];
    let nr = norm(cross(sub(a1,a0), sub(b0,a0)));
    if (!isFinite(nr[0])) continue;
    if (dot(nr, sub(avg([a0,a1,b1,b0]), cen)) < 0) nr = nr.map(v=>-v);
    if (flip) nr = nr.map(v=>-v);
    if (vis(nr)) s += face(pd([a0,a1,b1,b0]), colour(nr));
  }
  return s;
}
function hull(pts){
  pts = pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[], up=[];
  for (const p of pts){ while(lo.length>=2 && cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for (const p of pts.reverse()){ while(up.length>=2 && cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  lo.pop(); up.pop(); return lo.concat(up);
}
// Silhouette ink, weighted by how thick the part is on screen (like a hand inker): the w you pass is the most it gets.
// Thickness = 2 × area / perimeter of the outline (a rod's diameter, about half a box's width), as a share of the
// frame width. A long thin rod, a handle or a knob stays light (~1–1.5); a grinder, kettle or machine body gets the
// heavy ~2.4–2.8. Thin parts stay thin and parts keep air between them.
const hullInk = (pts3, w=1.4) => { const h = hull(pts3.map(p=>P(...p))); let a = 0, per = 0;
  for (let i = 0; i < h.length; i++){ const p = h[i], q = h[(i+1) % h.length]; a += p[0]*q[1] - q[0]*p[1]; per += Math.hypot(q[0]-p[0], q[1]-p[1]); }
  const thick = per ? Math.abs(a) / per / (INK_K * INK_REF_VB) : 0;
  return ink(sp(h), Math.min(w, .9 + 20*thick)); };
// Axis-aligned box: three visible faces, shaded, each outlined. shade = tone (sunlit) or toneI (interior).
function box(x0,y0,z0,x1,y1,z1,m,shade=toneI,w=.9){
  // all six faces, drawn only when they face the viewer (sides first, then top) — correct in every VIEW
  const F = [
    [[0,1,0],  [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]],
    [[1,0,0],  [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]],
    [[0,-1,0], [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]],
    [[-1,0,0], [[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]],
    [[0,0,1],  [[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]] ];
  return F.filter(([n]) => vis(n)).map(([n,q]) => shape(q, shade(n,m), w)).join('');
}
// Rounded-profile extrusion: profile (u=y, v=z) swept along x from x0 to x1. Body of most machines.
function extrude(profileUV, x0, x1, m, shade=tone){ return loft(on(PX(x0),profileUV), on(PX(x1),profileUV), n=>shade(n,m)); }
// Vertical cylinder (axis z) centred (x,y), radius r from z0 to z1, with top cap.
function cyl(x,y,z0,z1,r,m,shade=toneI,w=1.2,n=24){
  const A=on(PZ(z0),ellUV(x,y,r,r,n)), B=on(PZ(z1),ellUV(x,y,r,r,n));
  return loft(A,B,nr=>shade(nr,m)) + fill(pd(B),shade([0,0,1],m)) + hullInk([...A,...B],w) + ink(pd(B),w*.8);
}
// Cylinder lying along x (e.g. a knob or dial sticking out of a front face): centred (y,z), from x0 to x1.
function cylX(x0,x1,y,z,r,m,shade=toneI,w=1.1,n=20){
  const A=on(PX(x0),ellUV(y,z,r,r,n)), B=on(PX(x1),ellUV(y,z,r,r,n));
  // cap on whichever end faces the viewer (the +x end in VIEW 0)
  const capB = vis([1,0,0]), cap = capB ? B : A, cn = capB ? [1,0,0] : [-1,0,0];
  return loft(A,B,nr=>shade(nr,m)) + (vis(cn) ? fill(pd(cap),shade(cn,m)) : '') + hullInk([...A,...B],w) + (vis(cn) ? ink(pd(cap),w*.8) : '');
}
// Cylinder between any two 3D points a and b (a lamp arm, a rod, a pipe at an angle, a handle bar), radius r.
// The end facing the viewer gets a cap. For a tapered part (a cone, a lamp shade) pass r1 for the radius at b.
function rod(a, b, r, m, shade=toneI, w=1, r1=r, n=16){
  const d = norm(sub(b, a)), u = norm(cross(d, Math.abs(d[2]) < .9 ? [0,0,1] : [1,0,0])), v = cross(d, u);
  const ring = (p, rr) => Array.from({length:n}, (_,i) => { const t = i/n*2*Math.PI, c = Math.cos(t)*rr, s2 = Math.sin(t)*rr;
    return [p[0] + u[0]*c + v[0]*s2, p[1] + u[1]*c + v[1]*s2, p[2] + u[2]*c + v[2]*s2]; });
  const A = ring(a, r), B = ring(b, r1), capB = vis(d), cap = capB ? B : A, cn = capB ? d : d.map(x => -x);
  return loft(A, B, nr => shade(nr, m)) + (Math.max(r, r1) > 0 ? fill(pd(cap), shade(cn, m)) + ink(pd(cap), w*.8) : '') + hullInk([...A, ...B], w);
}
// Text lying flat on a front plane x = const, centred at (y,z) baseline; reads left-to-right on screen.
// text sits on a face: if its reading direction comes out mirrored (or edge-on), that face is turned away, so the text is hidden
const txM = (o, U, V) => (U[0]*V[1] - U[1]*V[0]) <= .02 * Math.hypot(...U) * Math.hypot(...V) ? `matrix(0 0 0 0 ${f(o[0])} ${f(o[1])})` : `matrix(${U[0].toFixed(4)} ${U[1].toFixed(4)} ${V[0].toFixed(4)} ${V[1].toFixed(4)} ${f(o[0])} ${f(o[1])})`;
const tx = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(0,-1,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Text on a side plane y = const, centred at (x,z).
const txY = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(1,0,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Cast shadow of a set of 3D points (any outline of the object), pushed along the light onto z = 0.
// the light stays put relative to the viewer, so the shadow is cast in turned coordinates
// z0: the surface it falls on (a board, a counter); clip it to that surface with clipTo(...) if it could spill off.
// clip: the 3D outline of the surface it falls on (e.g. boardTop(...)), so it can't spill over the edge.
const castShadow = (pts3, z0=0, clip=null) => { const k = SHADOW_LEN / SHADOW_K, [sx, sy] = yawTurn(SH);
  const s = fill(sp(hull(pts3.map(([x,y,z]) => P(x+(z-z0)*sx*k, y+(z-z0)*sy*k, z0)))), SHADOW);
  return clip ? clipTo(clip, s) : s; };
// A board for the object to stand on (a tray, a desk top, a counter): a rounded slab from (x0,y0) to (x1,y1), h thick.
// Draw it first; then castShadow(points, h, boardTop(x0,y0,x1,y1,h,r)) so shadows lie on it and stop at its edge.
const BOARD = { l:'#e6e1d4', m:'#cfc8b8', d:'#aaa293' }, WOOD = { l:'#d9a86c', m:'#bf8a4f', d:'#8e6236' };
const boardTop = (x0,y0,x1,y1,h=3,r=5) => on(PZ(h), rrUV(x0,y0,x1,y1,r));
function board(x0,y0,x1,y1,h=3,r=5,m=BOARD){
  const A = on(PZ(0), rrUV(x0,y0,x1,y1,r)), B = boardTop(x0,y0,x1,y1,h,r);
  return loft(A, B, n => toneI(n, m)) + fill(pd(B), m.l) + ink(pd(B), 1) + hullInk([...A, ...B], 1.8);
}
// Group helpers: clickable target, clip to an opening.
const act  = (name, inner, data='') => `<g data-act="${name}" ${data}>${inner}</g>`;
let _clipN = 0;
// Part label (for "how does it work" figures): a cream pill with a leader line to a 3D point on the part.
// dx, dy = where the pill sits, in screen units at the reference zoom (they scale with the figure like stroke widths).
// on = that part is working right now (the pill turns the accent colour). Labels can be hidden with the Labels switch.
function tag(p3, dx, dy, text, on=false){
  // on a phone (LBL_U = drawing units per screen px) the pill is a numbered badge and the names go in a legend under the figure
  const u = window.LBL_U ? LBL_U() : 0, n = ((window.__ln || (window.__ln = {}))[text] || (__ln[text] = Object.keys(__ln).length + 1));
  const k = INK_K, [X,Y] = P(...p3), fs = u ? 10*u : 8.6*k, h = u ? 17*u : fs*1.8, w = u ? h*(n > 9 ? 1.3 : 1) : text.length*fs*.62 + fs*1.5, cx = X + dx*k, cy = Y + dy*k;
  return `<g class="tag${on ? ' on' : ''}" data-n="${n}" data-t="${text}"><path d="M${f(X)} ${f(Y)}L${f(cx)} ${f(cy)}" fill="none" stroke="${INK}" stroke-width="1"/>`
    + `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(1.3*k)}" fill="${INK}"/>`

    const chips = document.createElement('div'); chips.className = 'chips'; wrap.appendChild(chips);
    el.onclick = e => { e.stopPropagation(); const open = !wrap.classList.contains('open'); closeChips();
      if (!open) return;
      chips.innerHTML = '';
      // every choice stays clickable, so nothing silently ignores a press:
      //   current:true  = the one in use (shown selected); a press just says so
      //   disabled:true = not possible right now (shown faded); a press says why (c.why, or a generic note)
      for (const c of b.choices(st)){ const ch = document.createElement('button'); ch.className = 'chip' + (c.current ? ' current' : c.disabled ? ' off' : ''); ch.textContent = c.label;
        if (c.current) ch.setAttribute('aria-pressed', 'true');
        ch.onclick = ev => { ev.stopPropagation(); closeChips();
          if (c.current) return ui.flash(`${c.label} — already set`);
          if (c.disabled) return ui.flash(c.why || `${c.label} isn't possible right now`);
          c.onClick(st, ui); ui.render(); }; chips.appendChild(ch); }
      wrap.classList.add('open'); };
  });
  function closeChips(){ document.querySelectorAll('.stepwrap.open').forEach(w => w.classList.remove('open')); }
  document.addEventListener('click', closeChips);

  document.getElementById('wb').oninput = e => document.getElementById('wob').setAttribute('scale', (e.target.value * INK_K).toFixed(2));
  const pals = document.getElementById('pals');
  for (const [k,p] of Object.entries(PALS)){
    const b = document.createElement('button'); b.className='sw'; b.title=k; b.style.background=p.l; b.setAttribute('aria-pressed', k===st.pal);
    b.onclick = () => { st.pal=k; [...pals.children].forEach(c=>c.setAttribute('aria-pressed', c===b)); ui.render(); };
    pals.appendChild(b);
  }
  // labels: the switch appears when the figure draws any tag(); ?labels=0 starts with them hidden
  const lblctl = document.getElementById('lblctl'), lbl = document.getElementById('lbl');
  const setLabels = on => { document.documentElement.classList.toggle('nolabels', !on); lbl.textContent = on ? 'On' : 'Off'; lbl.setAttribute('aria-pressed', on); };
  lbl.onclick = () => setLabels(document.documentElement.classList.contains('nolabels'));
  if (q.get('labels') === '0') setLabels(false);
  // testing: ?press=Label@ms,Label@ms clicks the buttons whose text starts with Label at those times after load
  // (any order, repeats allowed); Label>Choice picks a choice from a picker button (?press=Speed>3@300).
  // Script errors and unknown labels are recorded on <html data-errors="…">
  window.__st = st;
  const noteErr = m => { document.documentElement.dataset.errors = (document.documentElement.dataset.errors || '') + ' ' + m + ';'; };
  const starts = (el, t) => el.textContent.trim().toLowerCase().startsWith(t.trim().toLowerCase());
  if (q.has('press')) q.get('press').split(',').forEach(item => { const [what, ms] = item.split('@'), [label, choice] = what.split('>');
    setTimeout(() => { const b = [...document.querySelectorAll('.act')].find(b => starts(b, label));
      if (!b) return noteErr(`no button "${label}"`);
      b.click(); if (choice == null) return;
      const c = [...b.parentElement.querySelectorAll('.chip')].find(c => starts(c, choice));
      if (c && !c.disabled) c.click(); else noteErr(`no choice "${choice}" in "${label}"`); }, +ms || 0); });
  setLight(st.az); ui.render();
  if (art.querySelector('.tag')) lblctl.hidden = false;
  return ui;
}

/* ---------- see-through + labels kit (shared; the figure supplies its own working parts) ----------
   xrCallouts(items, B): pills in two columns either side of the object, sorted top to bottom so leaders never cross.
     items: [{ at:[x,y,z], text, on }], B: the object's bounds [x0, x1, y0, y1, z0, z1].
   xrGhost(body, mech, k, OUTp, x0, x1, m): far walls faintly, the working parts, then the case as a ghost over them.
   xrMount(getUI, caption): the See-through / Labels switches (top right), the caption under the figure, label hiding. */
function xrCallouts(items, B){
  const pts = []; for (const x of [B[0], B[1]]) for (const y of [B[2], B[3]]) for (const z of [B[4], B[5]]) pts.push(P(x, y, z));
  const xmin = Math.min(...pts.map(p => p[0])), xmax = Math.max(...pts.map(p => p[0])), cx = (xmin + xmax)/2;
  // on a phone (LBL_U = drawing units per screen px) each label is a numbered badge and the names go in a legend under the figure
  const k = INK_K, u = window.LBL_U ? LBL_U() : 0, fs = u ? 10*u : 8.6*k, hgt = u ? 17*u : fs*1.8, gap = hgt + (u ? 3*u : 3*k);
  const L = [], R = [];
  const svgEl = document.getElementById('fig'), vb = svgEl.viewBox.baseVal, btn = document.getElementById('btns');
  const wMax = u ? hgt*1.3 + 12*k : Math.max(...items.map(it => it.text.length))*fs*.62 + fs*1.5 + 12*k;
  const roomL = xmin - vb.x >= wMax, roomR = vb.x + vb.width - xmax >= wMax;
  for (const it of items){ const [X, Y] = P(...it.at); ((X < cx && roomL) || !roomR ? L : R).push({ ...it, X, Y }); }
  let s = '';
  let top = { [-1]: fs, [1]: fs + 30*k };
  if (btn && svgEl.getScreenCTM()){ const r = btn.getBoundingClientRect(), q = new DOMPoint(r.right, r.bottom + 50).matrixTransform(svgEl.getScreenCTM().inverse());
    if (q.y > 0) top[-1] = q.y + hgt; }
  for (const [col, side] of [[L, -1], [R, 1]]){
    col.sort((a, b) => a.Y - b.Y);
    let y = -1e9; for (const c of col){ c.py = Math.max(c.Y, y + gap, top[side]); y = c.py; }
    const shift = col.length ? Math.max(0, col.reduce((a, c) => a + c.py - c.Y, 0) / col.length) : 0;
    const room = col.length ? col[0].py - top[side] : 0; for (const c of col) c.py -= Math.min(shift, room);
    for (const c of col){
      c.n = ((window.__ln || (window.__ln = {}))[c.text] || (__ln[c.text] = Object.keys(__ln).length + 1)); const w = u ? hgt*(c.n > 9 ? 1.3 : 1) : c.text.length*fs*.62 + fs*1.5;
      let px = side < 0 ? xmin - 10*k - w/2 : xmax + 10*k + w/2; px = Math.max(vb.x + w/2 + 2*k, Math.min(vb.x + vb.width - w/2 - 2*k, px));
      const ex = px - side*w/2;
      s += `<g class="tag${c.on ? ' on' : ''}" data-n="${c.n}" data-t="${c.text}"><path d="M${f(c.X)} ${f(c.Y)}L${f(ex + side*-4*k)} ${f(c.py)}L${f(ex)} ${f(c.py)}" fill="none" stroke="${INK}" stroke-width="1"/>`
        + `<circle cx="${f(c.X)}" cy="${f(c.Y)}" r="${f(1.4*k)}" fill="${INK}"/>`
        + `<rect x="${f(px - w/2)}" y="${f(c.py - hgt/2)}" width="${f(w)}" height="${f(hgt)}" rx="${f(hgt/2)}" fill="${c.on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
        + `<text x="${f(px)}" y="${f(c.py + fs*.36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${INK}">${u ? c.n : c.text}</text></g>`;
    }
  }
  return s;
}
function xrGhost(body, mech, k, OUTp, x0, x1, m){
  const fF = facing([1,0,0]), fB = facing([-1,0,0]);
  const far = `<g opacity="${f(.5*k)}">` + loft(on(PX(x0), OUTp), on(PX(x1), OUTp), n => mix(toneI(n.map(v => -v), m), '#f2efe7', .55), true)
    + (fF ? fill(pd(on(PX(x0), OUTp)), mix(m.d, '#f2efe7', .5)) : '') + (fB ? fill(pd(on(PX(x1), OUTp)), mix(m.d, '#f2efe7', .5)) : '') + `</g>`;
  return far + mech + `<g opacity="${f(1 - .8*k)}">${body}</g>` + `<g opacity="${f(.6*k)}">` + hullInk([...on(PX(x0), OUTp), ...on(PX(x1), OUTp)], 2.8) + `</g>`;
}
function xrMount(getUI, caption, opt = {}){   // opt.labelsOnly: only the Labels switch (the insides are on show already)
  const ui = getUI(), q = new URLSearchParams(location.search), html = document.documentElement;
  if (q.get('labels') !== '1') html.classList.add('nolabels');
  if (ui.st.xr == null){ ui.st.xr = 0; ui.st.xrT = 0; }
  if (q.get('xr') === '1') ui.st.xr = ui.st.xrT = 1;
  const old = document.getElementById('lblctl'); if (old) old.style.display = 'none';
  const vset = document.createElement('div'); vset.className = 'vset';
  vset.innerHTML = '<div class="vrow">' + (opt.labelsOnly ? '' : '<button class="act" id="xrb" aria-pressed="false">See-through</button>') + '<button class="act" id="lblb" aria-pressed="false">Labels</button></div>';
  document.querySelector('.stage').appendChild(vset);
  // pages with a stats panel in the top right: the switches go just under it
  const place = () => { const sp = document.getElementById('stats'); vset.style.top = sp ? (sp.offsetTop + sp.offsetHeight + 10) + 'px' : ''; };
  place(); new ResizeObserver(place).observe(document.getElementById('stats') || vset);
  const xrb = document.getElementById('xrb'), lblb = document.getElementById('lblb');
  const sync = () => { if (xrb) xrb.setAttribute('aria-pressed', !!getUI().st.xrT); lblb.setAttribute('aria-pressed', !html.classList.contains('nolabels')); };
  if (xrb) xrb.onclick = () => { const u = getUI(), st = u.st; st.xr = st.xr || 0; st.xrT = st.xrT ? 0 : 1; sync();
    u.animate(dt => { const g = Math.sign(st.xrT - st.xr); st.xr = Math.min(1, Math.max(0, st.xr + g*dt/.7)); return st.xr !== st.xrT; }); };
  lblb.onclick = () => { html.classList.toggle('nolabels'); sync(); };
  sync();
  const cap = document.createElement('p'); cap.className = 'mcap'; document.querySelector('.stage').after(cap);
  const css = document.createElement('style');
  css.textContent = '.vset{position:absolute;top:4px;right:0;z-index:2}.vrow{display:flex;gap:6px}.vset .act[aria-pressed=true]{background:var(--ink);color:var(--paper)}'
    + 'html.nolabels #fig .tag{display:none}.mcap{width:100%;max-width:760px;min-height:3em;margin:0 0 14px;font-size:12.5px;line-height:1.5;text-align:center;transition:opacity .3s}'
    + '@media (max-width:560px){.vset{position:static;margin:4px 0}}';
  document.head.appendChild(css);
  const r0 = ui.render; ui.render = () => { r0(); const st = getUI().st; cap.style.opacity = st.xr > .5 ? 1 : 0; cap.textContent = caption(st); };
  ui.render();
}
// same, for a body lofted between two horizontal rings A (bottom) and B (top)
function xrGhostRings(body, mech, k, A, B, m){
  const far = `<g opacity="${f(.5*k)}">` + loft(A, B, n => mix(toneI(n.map(v => -v), m), '#f2efe7', .55), true) + fill(pd(A), mix(m.d, '#f2efe7', .5)) + `</g>`;
  return far + mech + `<g opacity="${f(1 - .8*k)}">${body}</g>` + `<g opacity="${f(.6*k)}">` + hullInk([...A, ...B], 2.8) + `</g>`;
}
// generic see-through for any figure: the whole drawing fades back and the inside parts show over it.
//   opts: { mech(st, k) -> svg, inside(st) -> label items, surface(st) -> label items (optional), B: bounds, getSt() }
// washer-style ghost for an object without a single box case: its inside parts first, then the object pale over them
const xrUnder = (svg, mech, k) => `<g opacity="${f(k)}">${mech}</g><g opacity="${f(1 - .62*k)}">${svg}</g>`;
function xrWrap(sceneFn, opts){
  return function(){
    let s = sceneFn.apply(this, arguments);
    const st = opts.getSt(), k = ease(st.xr || 0);
    if (k > 0 && opts.under) s = xrUnder(s, opts.mech(st, k), k);   // the whole drawing is the object
    else if (k > 0 && !opts.inline) s = `<g opacity="${f(1 - .5*k)}">${s}</g><g opacity="${f(k)}">${opts.mech(st, k)}</g>`;   // inline: the figure ghosts its own case
    const items = k > .6 ? opts.inside(st) : opts.surface ? opts.surface(st) : [];
    return s + (items.length ? xrCallouts(items, opts.B) : '');
  };
}

/* ---------- game keypad: mountKeypad({ rows, hub:[col,row], action:'DROP', keys:[{ key:'ArrowLeft', glyph:'\u25c0', name, at:[col,row] }] })
   An inked pad under the buttons that sends the same keyboard events as the arrows and space (set window.GAME_KEYS = true
   so the arrows play instead of turning the camera). ---------- */
function mountKeypad(spec){
  const host = document.getElementById('btns'); if (!host) return;
  const css = document.createElement('style');
  css.textContent = `.kpad{display:flex;align-items:center;gap:16px;margin-top:6px;padding:10px 12px;border:1.5px solid var(--ink);border-radius:14px;
      background:var(--paper);box-shadow:0 3px 0 var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
    .kpad .dp{display:grid;grid-template-columns:repeat(3,34px);grid-template-rows:repeat(var(--rows),34px);gap:3px}
    .kpad .k{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;width:34px;height:34px;cursor:pointer;
      background:#fbf7ea;border:1.5px solid var(--ink);border-radius:7px;box-shadow:0 3px 0 var(--ink);color:var(--ink);font:700 13px ui-monospace,Menlo,monospace;
      transition:transform .05s,box-shadow .05s,background .05s}
    .kpad .hub{width:34px;height:34px;display:flex;align-items:center;justify-content:center}
    .kpad .hub i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink);background:#e6e0d1}
    .kpad .go{all:unset;box-sizing:border-box;width:62px;height:62px;border-radius:50%;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:#e2483d;border:1.5px solid var(--ink);box-shadow:0 4px 0 var(--ink),inset 0 -5px 0 rgba(0,0,0,.18);color:#fff;font:800 12px ui-monospace,Menlo,monospace;letter-spacing:.06em;
      transition:transform .05s,box-shadow .05s}
    .kpad .go small{font:700 8px ui-monospace,Menlo,monospace;opacity:.85;letter-spacing:.08em;margin-top:2px}
    .kpad .down{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
    .kpad .k.down{background:var(--accent,#f4b829)}
    .kpad .go.down{transform:translateY(3px);box-shadow:0 1px 0 var(--ink),inset 0 -3px 0 rgba(0,0,0,.18)}
    @media (max-width:560px){.kpad{gap:22px;padding:10px 16px}.kpad .dp{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(var(--rows),44px)}
      .kpad .k,.kpad .hub{width:44px;height:44px;font-size:15px}.kpad .go{width:74px;height:74px}}`;
  document.head.appendChild(css);
  const pad = document.createElement('div'); pad.className = 'kpad'; pad.setAttribute('role', 'group'); pad.setAttribute('aria-label', 'Keypad');
  const dp = document.createElement('div'); dp.className = 'dp'; dp.style.setProperty('--rows', spec.rows);
  const els = {};
  for (const k of spec.keys){
    const b = document.createElement('button'); b.className = 'k'; b.textContent = k.glyph; b.setAttribute('aria-label', k.name);
    b.style.gridColumn = k.at[0] + 1; b.style.gridRow = k.at[1] + 1; dp.appendChild(b); els[k.key] = b; }
  if (spec.hub){ const h = document.createElement('div'); h.className = 'hub'; h.innerHTML = '<i></i>'; h.style.gridColumn = spec.hub[0] + 1; h.style.gridRow = spec.hub[1] + 1; dp.appendChild(h); }
  const go = document.createElement('button'); go.className = 'go'; go.innerHTML = `${spec.action}<small>SPACE</small>`; go.setAttribute('aria-label', spec.action);
  els[' '] = go;
  pad.append(dp, go); host.appendChild(pad);
  const send = (type, key) => dispatchEvent(new KeyboardEvent(type, { key, bubbles: true }));
  for (const [key, el] of Object.entries(els)){
    let held = null;
    el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (held != null) return; held = e.pointerId;
      try { el.setPointerCapture(e.pointerId); } catch (_) {} send('keydown', key); });
    const release = e => { if (held == null || (e && e.pointerId !== held)) return; held = null; send('keyup', key); };
    el.addEventListener('pointerup', release); el.addEventListener('pointercancel', release); el.addEventListener('lostpointercapture', release);
    el.addEventListener('click', e => e.preventDefault());
    el.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); send('keydown', key); setTimeout(() => send('keyup', key), 120); } });
  }
  // space belongs to the game: a button that still has the focus from a click must not be pressed by it too
  addEventListener('keydown', e => { if (e.key === ' ' && e.target && e.target.closest && e.target.closest('button')) e.preventDefault(); }, true);
  addEventListener('keyup', e => { if (e.key === ' ' && e.target && e.target.closest && e.target.closest('button')) e.preventDefault(); }, true);
  // light the keys for real key presses too (and for the pad's own, which arrive the same way)
  addEventListener('keydown', e => { const el = els[e.key]; if (el) el.classList.add('down'); });
  addEventListener('keyup', e => { const el = els[e.key]; if (el) el.classList.remove('down'); });
  addEventListener('blur', () => Object.values(els).forEach(el => el.classList.remove('down')));
}

<script>
/* Microduck — a 25 cm bipedal robot duck that walks with a reinforcement-learning policy.
   1 unit = 1 mm. x = depth (the duck faces +x at the start), y = width (+y = the duck's left), z = up.

   HOW IT REALLY WORKS
   1. A 6 V battery pack in the body feeds the servo bus directly (through the power switch on the back) and a 5 V buck
      converter that powers the Raspberry Pi Zero 2 W.
   2. The Pi reads the IMU (BNO085, I2C) for the body's tilt, takes the walk / turn command, and runs the trained ONNX
      policy 50 times a second: 61 numbers in (tilt, joint angles, command), 14 joint targets out.
   3. The Pi sends the targets over USB to the OpenRB-150 servo board, which drives one Dynamixel bus in three
      daisy-chained branches: right leg 5→4→3→2→1, left leg 10→9→8→7→6, neck and head 12→11→13→14 (+15, the beak).
   4. Each XL330 servo turns its horn to the target; brackets carry the motion down the leg (hip yaw → hip roll → hip
      pitch → knee → ankle) or up the neck to the head. The beak servo (15) is outside the walking policy.

   PARTS (each held by another)
   CASE      body shell . head shell . upper bill (fixed) . lower bill (hinged) . two face plates . two eye rings .
             two thigh covers . two foot shells with soles . power switch on the body's back
   LEGS      per leg: hip yaw servo (inside the body, horn down) . hip roll servo hung from it . roll bracket . hip pitch
             servo . thigh plates . knee servo . shin plates . ankle servo . foot plates . bus cable down the back
   NECK/HEAD neck pitch servo (12) standing in the body top . neck plates . head pitch servo (11) . head plates .
             head yaw (13) and head roll (14) servos inside the head . beak servo (15) and its link rod . camera
             board behind the right eye . ToF sensor board behind the left eye . ribbon down the neck
   BODY      battery pack . 5 V buck converter . IMU board on the floor . Pi Zero 2 W above the battery . OpenRB-150
             on the back wall . USB lead Pi→OpenRB . bus cables . power leads */

const W = 340, D = 260, H = 655, CX = 170, CY = 130;
const L1 = 31, L2 = 31, ANK = 26, HIPY = 25, PZ0 = 78, PZS = 32;
const ACC = { mint:'#f08a3c', cobalt:'#f4c430', blush:'#f4c430', mustard:'#e8643a', tomato:'#f4c430' };
const NP0 = .12;
const CRD = 30, SKH = 12;   // how far a crouch lowers the hips; how far the skate wheels lift the duck   // the neck leans a little forward at rest
const SRV = matOf('#4a4643'), HORNM = METAL, ALUM = matOf('#d6d9db'), FACEM = matOf('#d2d2cc'), LENSM = matOf('#2b3038');
const PCBG = matOf('#2f8a4a'), PCBT = matOf('#1f7a8c'), PCBP = matOf('#6a4bb5'), PCBB = matOf('#2f62b0'), BATM = matOf('#3f6fc4');
const CHIP = matOf('#2a2826'), GOLD = matOf('#d8b25a');

/* ---------- vectors and frames ---------- */
const mAdd = (a, b) => [a[0]+b[0], a[1]+b[1], a[2]+b[2]], mSc = (a, k) => [a[0]*k, a[1]*k, a[2]*k];
const mComb = (a, ka, b, kb) => [a[0]*ka + b[0]*kb, a[1]*ka + b[1]*kb, a[2]*ka + b[2]*kb];
const mLerp = (a, b, t) => a + (b - a)*t;
const mFR = (o, x, y, z) => ({ o, x, y, z });
const fpt = (F, p) => [0,1,2].map(i => F.o[i] + p[0]*F.x[i] + p[1]*F.y[i] + p[2]*F.z[i]);
const fmov = (F, p) => mFR(fpt(F, p), F.x, F.y, F.z);
const fRz = (F, a) => { const c = Math.cos(a), s = Math.sin(a); return mFR(F.o, mComb(F.x, c, F.y, s), mComb(F.x, -s, F.y, c), F.z); };
const fRy = (F, a) => { const c = Math.cos(a), s = Math.sin(a); return mFR(F.o, mComb(F.x, c, F.z, -s), F.y, mComb(F.z, c, F.x, s)); };   // + = nose down
const fRx = (F, a) => { const c = Math.cos(a), s = Math.sin(a); return mFR(F.o, F.x, mComb(F.y, c, F.z, s), mComb(F.z, c, F.y, -s)); };
const mNeg = a => a.map(v => -v);
const boxOf = (pts, e = .05) => [[0,1,2].map(i => Math.min(...pts.map(p => p[i])) - e), [0,1,2].map(i => Math.max(...pts.map(p => p[i])) + e)];
const wrapA = a => Math.atan2(Math.sin(a), Math.cos(a));
// a segment frame: z runs up the segment (from p1 to o), y stays the joint axis
const segF = (o, p1, yAx) => { const z = norm(sub(o, p1)), x = norm(cross(yAx, z)), y = cross(z, x); return mFR(o, x, y, z); };

/* ---------- drawing in a frame ---------- */
// oriented box between local corners a and b; returns { box, svg, pts }
function oBox(F, a, b, mm, shade = toneI, w = .8){
  const c = (i, j, k) => fpt(F, [i ? b[0] : a[0], j ? b[1] : a[1], k ? b[2] : a[2]]);
  const Fc = [
    [F.x,      [c(1,0,0), c(1,1,0), c(1,1,1), c(1,0,1)]], [mNeg(F.x), [c(0,0,0), c(0,1,0), c(0,1,1), c(0,0,1)]],
    [F.y,      [c(0,1,0), c(1,1,0), c(1,1,1), c(0,1,1)]], [mNeg(F.y), [c(0,0,0), c(1,0,0), c(1,0,1), c(0,0,1)]],

// a rounded shell: profile (u, v) swept along ax through rings [t, scale] (scaled about the profile centre); caps at the ends

const horn = (F, c, axL, r = 7, t = 1.6) => { const a = fpt(F, c), b = fpt(F, mAdd(c, mSc(axL, t)));

    const la = Math.hypot(...sub(a, b)), lc = Math.hypot(...sub(c, b)), d = Math.min(r, la/2.2, lc/2.2);

// three pieces on either side of a joint axis, drawn far side first
const sides = (axW, far, mid, near) => facing(axW) ? far + mid + near : near + mid + far;
const grp = (items, extra = []) => { const all = items.filter(Boolean); return { box: boxOf(all.flatMap(i => [i.box[0], i.box[1]]), 0), svg: all.map(i => i.svg).join('') }; };

/* ---------- pose -> frames ---------- */
const nominal = (st, s, bx = st.bx, by = st.by, th = st.th) => ({ x: bx - Math.sin(th)*s*HIPY, y: by + Math.cos(th)*s*HIPY, yaw: th });

  const th = st.th, pz = mLerp(PZ0, PZS, st.sit) - CRD*(st.cr || 0) + st.bob + SKH*(st.sk || 0);
  const base = mFR([st.bx, st.by, 0], [Math.cos(th), Math.sin(th), 0], [-Math.sin(th), Math.cos(th), 0], [0,0,1]);

function legGeo(st, s, TF){
  const ft = st.feet[s > 0 ? 'L' : 'R'];

function headGeo(st, TF){
  const F1 = fRy(fmov(TF, [-14, 0, 52]), st.np + NP0);
  const F2 = fRx(fRz(fRy(fmov(F1, [0, 0, 52]), st.hp - NP0), st.hy), st.hr);

/* ---------- the head profile (y, z): flat underside, big round top ---------- */
const HEADP = [...arcUV(33-6, -12+6, 6, -90, 0, 4), ...arcUV(33-21, 46-21, 21, 0, 90, 8), ...arcUV(-33+21, 46-21, 21, 90, 180, 8), ...arcUV(-33+6, -12+6, 6, 180, 270, 4)];
const TORSOP = rrUV(-36, 0, 36, 34, 13, 6);
/* ---------- exploded view + build steps ----------
   Build order (every servo gets its ID set first, one at a time): feet and ankles, knees, hip pitch, hip roll, the body
   core of servos, the electronics, the shells, the neck, the head mechanism, the head shell and bills, the wiring.
   Each part names its step and where it sits in the exploded view (mm, in the body's own axes: x forward,
   y toward the duck's left, z up). */
const STEPS = [
  { name:'Feet + ankles',      n:2,  say:'Step 1: each foot holds an ankle servo (ID 1 right, 6 left) between its two plates.' },
  { name:'Knee servos',        n:4,  say:'Step 2: shin plates go on the ankle horns, with a knee servo (2 / 7) at the top of each shin.' },
  { name:'Hip pitch',          n:6,  say:'Step 3: thigh plates on the knee horns carry the hip pitch servos (3 / 8).' },
  { name:'Hip roll',           n:8,  say:'Step 4: a roll bracket joins each hip pitch servo to a hip roll servo (4 / 9). Both legs are done.' },
  { name:'Body core',          n:11, say:'Step 5: two hip yaw servos (5 / 10) and the neck pitch servo (12) form the body core. The legs hang from the yaw horns.' },
  { name:'Electronics',        n:11, say:'Step 6: the NP-F550 battery, the power board and the body IMU on the floor, the RK3566 main board on top, the servo bus at the back.' },
  { name:'Body shell',         n:11, say:'Step 7: the body shell closes over the electronics and the thigh covers clip onto the thighs.' },
  { name:'Neck',               n:12, say:'Step 8: neck plates on the neck pitch horn carry the head pitch servo (11).' },
  { name:'Head mechanism',     n:15, say:'Step 9: head yaw (13), head roll (14) and beak (15) servos, with the camera, the 8×8 time-of-flight sensor and the second IMU in the head.' },
  { name:'Head shell + bills', n:15, say:'Step 10: the lower bill hangs on the beak link, then the head shell and upper bill close the head.' },
  { name:'Wiring',             n:15, say:'Step 11: three bus branches (right leg, left leg, neck and head), the lead from the main board and the power leads.' },
];
const NSTEP = STEPS.length, LY = 40;
const EXO = {   // exploded offsets
  foot:[0,LY,0], ankle:[0,LY,26], knee:[0,LY,54], pitch:[0,LY,82], bracket:[0,LY,106], roll:[0,LY,126], cover:[0,80,82],
  core:[0,0,158], battery:[70,0,155], imu:[112,18,150], buck:[112,-18,150], pi:[0,0,232], rb:[-60,0,250], shell:[-125,0,158],
  neck:[0,0,232], headIn:[0,0,290], headShell:[0,0,385], lowBill:[65,0,262], upBill:[75,0,302] };
// how far a part fitted in this step is pulled out: 1 = fully exploded, 0 = in place, null = not fitted yet
function amtOf(st, step){
  if (st.mode === 'build') return step < st.step ? 0 : step === st.step ? 1 - ease(st.bk) : null;
  return ease(st.ex);
}
// world offset of a part (side s mirrors y for the legs), or null when it isn't fitted yet
function offOf(st, TF, step, key, s = 1){ const a = amtOf(st, step); if (a == null) return null; const l = EXO[key] || [0,0,0];
  return [0,1,2].map(i => (TF.x[i]*l[0] + TF.y[i]*l[1]*s + TF.z[i]*l[2])*a); }
const T = (F, o) => mFR(mAdd(F.o, o), F.x, F.y, F.z);
const placed = (st, step) => amtOf(st, step) === 0;
// wires go in last, only between parts that are in place
const wireAlpha = st => st.mode === 'build' ? (st.step < NSTEP ? 0 : st.step === NSTEP ? ease(st.bk) : 1) : Math.max(0, 1 - 3*ease(st.ex));
const wires = (items, a) => a <= .01 ? [] : a >= .99 ? items : items.map(it => ({ box: it.box, svg: `<g opacity="${f(a)}">${it.svg}</g>` }));
// during the wiring step the shells go see-through so the cables show
const shellA = st => Math.min(st.mode === 'build' && st.step === NSTEP ? 1 - .75*ease(st.bk) : 1, 1 - .8*ease(st.xr || 0));   // + the See-through switch
const gh = (st, svg) => { const a = shellA(st); return a < .99 ? `<g opacity="${f(a)}">${svg}</g>` : svg; };
const corners = items => items.flatMap(i => [i.box[0], i.box[1]]);

/* ---------- a leg ---------- */
function drawLeg(st, s, TF, m, acc, SHP){
  const g = legGeo(st, s, TF), out = [], put = it => out.push(it), at = (step, key) => offOf(st, TF, step, key, s);
  const sole = mix(acc, '#000000', .38);
  let o;
  // step 4: the hip roll servo on the yaw horn, and its bracket
  if ((o = at(4, 'roll'))){ const R0 = T(g.R0, o); put(grp([servo(R0, [-26, -13, -10], [0, 13, 10]), horn(R0, [0, 0, 0], [1, 0, 0], 7)])); }
  if ((o = at(4, 'bracket'))) put(oBox(T(g.RF, o), [1.6, -12, -14], [4.2, 12, 6], ALUM, toneI, .7));
  // step 3: thigh plates and the hip pitch servo between them
  if ((o = at(3, 'pitch'))){ const TH = T(g.TH, o), HF = T(g.HF, o);
    for (const sy of [-1, 1]) put(oBox(TH, [-7, sy*11.6, -14], [7, sy*13.4, 7], ALUM, toneI, .7));
    put(servo(HF, [-9, -10, -13], [25, 10, 13])); }
  // step 2: shin plates and the knee servo

    for (const sy of [-1, 1]) put(oBox(SH, [-7, sy*11.6, -14], [7, sy*13.4, 7], ALUM, toneI, .7));
    put(servo(TH, [-13, -10, -L1 - 8], [13, 10, -L1 + 26])); }
  // step 1: the ankle servo, then the foot with its two plates
  if ((o = at(1, 'ankle'))) put(servo(T(g.SH, o), [-13, -10, -L2 - 8], [13, 10, -L2 + 26]));
  if ((o = at(1, 'foot'))){ const FF = T(g.FF, o), plan = rrUV(-24, -18, 38, 18, 12, 5);
    for (const sy of [-1, 1]) put(oBox(FF, [-7, sy*11.6, 15], [7, sy*13.4, ANK + 7], ALUM, toneI, .7));
    const so = sweep(FF.o, FF.z, FF.x, FF.y, plan, [[0, 1], [3.5, 1]], matOf(sole), toneI, 1.6, .9);
    const sh = sweep(FF.o, FF.z, FF.x, FF.y, plan, [[3.5, 1], [12.5, 1], [15.5, .9]], matOf(acc), tone, 2.2, 1.2);
    // roller skates: two wheels under each sole, a spoke shows them turning
    let wh = '', wp = [];
    if ((st.sk || 0) > .01){ const r = 9*st.sk, zc = -SKH*st.sk + r, side = facing(FF.y) ? 1 : -1;
      for (const x of [-12, 26]){ wh += rod(fpt(FF, [x, -8, zc]), fpt(FF, [x, 8, zc]), r, matOf('#e9e3d2'), toneI, 1.1, r, 18);
        wh += ink(pd([fpt(FF, [x, side*8.3, zc]), fpt(FF, [x + r*.8*Math.cos(st.wa || 0), side*8.3, zc + r*.8*Math.sin(st.wa || 0)])], false), 1);

    put({ box: boxOf([...so.pts, ...sh.pts, ...wp]), svg: wh + so.svg + sh.svg }); SHP.push(...sh.pts, ...wp); }
  if (placed(st, 2)) SHP.push(g.K);
  if (placed(st, 3)) SHP.push(g.HF.o);
  if (placed(st, 4)) SHP.push(fpt(g.R0, [0, 0, 10]));
  // step 11: bus cable down the back of the leg, roll -> pitch -> knee -> ankle
  out.push(...wires(cable([fpt(g.R0, [-14, 0, 10.5]), fpt(g.R0, [-27, s*4, 4]), fpt(g.R0, [-27, s*4, -8]), fpt(g.HF, [-10.5, s*4, 4]),
    fpt(g.HF, [-10.5, s*4, -8]), fpt(g.TH, [-14, s*4, -14]), fpt(g.TH, [-14, s*4, -40]), fpt(g.SH, [-14, s*4, -14]), fpt(g.SH, [-14, s*4, -26])], '#2f2c2a', 2.4), wireAlpha(st)));

/* ---------- body, neck and head ---------- */
function drawUpper(st, m, acc, TF, hg, SHP){

    const tor = sweep(TS.o, TS.x, TS.y, TS.z, TORSOP, [[-39, .84], [-33, 1], [33, 1], [39, .84]], m, tone, 2.6, 1.4);
    shell = tor.svg;

      let v = ''; for (let yy = -20; yy <= 0; yy += 5) v += pd([fpt(TS, [-39.1, yy, 9]), fpt(TS, [-39.1, yy, 23])], false);

    if (facing(TS.z)) shell += shape([[-27,-10],[-1,-10],[-1,10],[-27,10]].map(([x, y]) => fpt(TS, [x, y, 34.1])), '#2b2725', .9);

  const billP = rrUV(0, -31, 100, 31, 17, 6), lowP = rrUV(0, -27, 88, 27, 15, 6);

/* ---------- inside the body: core servos (step 5), electronics (step 6), wiring (step 11) ---------- */
function torsoInside(st, TF, SHP){
  const P2 = [], put = it => P2.push(it);

function roomFor(st, dist){ const end = [st.bx + dist*Math.cos(st.th), st.by + dist*Math.sin(st.th)]; return Math.hypot(end[0] - CX, end[1] - CY) <= 60 || st.queue.length; }

function walk(st, d){
  if (onSkates(st)) return glide(st, d);
  if (!roomFor(st, 4*d*STRIDE)) return ui.flash(d > 0 ? 'No room ahead: turn or walk back' : 'No room behind: turn or walk forward');
  queue(st, [...standFirst(st), stepMove(1, 'walk', d), stepMove(-1, 'walk', d), stepMove(1, 'walk', d), stepMove(-1, 'walk', d), stepMove(0, 'settle', 0), stepMove(0, 'settle', 0)]);
}
function turn(st, d){
  if (onSkates(st)) return spin(st, d);
  queue(st, [...standFirst(st), stepMove(d, 'turn', d), stepMove(-d, 'turn', d), stepMove(0, 'settle', 0), stepMove(0, 'settle', 0)]);
}
// on skates the legs pump in a scissor and the duck rolls; turning becomes a spin on the spot
function glide(st, d){
  const dist = 5*STRIDE*d;
  if (!roomFor(st, dist)) return ui.flash(d > 0 ? 'No room ahead: spin round first' : 'No room behind: spin round first');
  queue(st, [...(planned(st, 'sit') > .5 ? [sitMove(0)] : []), { dur: 1.8, ids: [2,3,7,8], begin(st){ this.b0 = [st.bx, st.by]; this.th = st.th; this.f0 = { L: { ...st.feet.L }, R: { ...st.feet.R } }; this.w0 = st.wa || 0; },
    upd(st, k){ const e = ease(k), dx = Math.cos(this.th)*dist*e, dy = Math.sin(this.th)*dist*e;
      st.bx = this.b0[0] + dx; st.by = this.b0[1] + dy; st.wa = this.w0 - dist*e/7;
      for (const [key, s] of [['L', 1], ['R', -1]]){ const sw = 7*Math.sin(4*Math.PI*k + (s > 0 ? 0 : Math.PI))*Math.sin(Math.PI*k);
        st.feet[key].x = this.f0[key].x + dx + Math.cos(this.th)*sw; st.feet[key].y = this.f0[key].y + dy + Math.sin(this.th)*sw; } } }]);
}
function spin(st, d){
  queue(st, [...(planned(st, 'sit') > .5 ? [sitMove(0)] : []), { dur: 1.6, ids: [2,3,7,8], begin(st){ this.th0 = st.th; this.w0 = st.wa || 0; },
    upd(st, k){ st.th = this.th0 + d*Math.PI/2*ease(k); st.wa = this.w0 + 3*Math.PI*ease(k);
      for (const s of [1, -1]){ const n = nominal(st, s); Object.assign(st.feet[legOf(s)], { x: n.x, y: n.y, yaw: st.th }); } } }]);
}
function sitStand(st){
  if (onSkates(st)) return ui.flash('Take the skates off to sit');
  const to = planned(st, 'sit') > .5 ? 0 : 1;
  queue(st, [...(to ? (planned(st, 'cr') > .3 ? [crouchMove(0)] : []) : []), sitMove(to)]);
}
function crouch(st){ const to = planned(st, 'cr') > .3 ? 0 : 1; queue(st, [...(planned(st, 'sit') > .5 ? [sitMove(0)] : []), crouchMove(to)]); }
function look(st){ queue(st, [keyMove(3.4, [11, 12, 13, 14], [{}, { hy: .75, hp: -.15 }, { hy: .75, hp: .2 }, { hy: -.75, hp: .1, hr: .18 }, { hy: -.75, hp: -.15, hr: -.1 }, { hy: 0, hp: 0, hr: 0 }])]); }
function skates(st){
  const to = onSkates(st) ? 0 : 1;
  queue(st, [...standFirst(st), Object.assign(poseMove(.9, [1, 6], { sk: to }), { plan: { sk: to }, begin(st){ this.a = { sk: st.sk || 0 }; ui.flash(to ? 'Feet off, wheels on: Walk now rolls, Turn now spins' : 'Back on its feet', 2400); } })]);
}

// kick: the ball appears in front of the right foot, the leg winds back and swings through
function rollBall(){ const st = ui.st;
  ui.animate(dt => { const b = st.ball; if (!b) return false;
    if (b.v > 0){ const ds = b.v*dt; b.x += Math.cos(b.dir)*ds; b.y += Math.sin(b.dir)*ds; b.rot += ds/BALL_R; b.v = Math.max(0, b.v - 330*dt); return true; }
    b.rest += dt; if (b.rest > 1.6){ b.a -= dt/.5; if (b.a <= 0){ st.ball = null; return false; } }
    return true; }); }
function kick(st){
  if (onSkates(st)) return ui.flash('Take the skates off to kick');
  queue(st, [...standFirst(st), { dur: 1.2, ids: [1,2,3,4,5], begin(st){ const th = st.th, n = nominal(st, -1);
      st.ball = { x: n.x + 64*Math.cos(th), y: n.y + 64*Math.sin(th), dir: th, rot: 0, v: 0, a: 1, rest: 0 };
      this.f0 = { ...st.feet.R }; this.th = th; this.hit = false; },
    upd(st, k){ const ft = st.feet.R, th = this.th; let fwd, lift;
      if (k < .4){ const u = ease(k/.4); fwd = -14*u; lift = 16*u; }
      else if (k < .6){ const u = (k - .4)/.2; fwd = -14 + 50*u; lift = 16 - 6*u; }
      else { const u = ease((k - .6)/.4); fwd = 36*(1 - u); lift = 10*(1 - u); }
      ft.x = this.f0.x + Math.cos(th)*fwd; ft.y = this.f0.y + Math.sin(th)*fwd; ft.lift = lift;
      st.sway = 6*Math.sin(Math.PI*Math.min(1, k*1.2));
      if (!this.hit && k >= .56 && st.ball){ this.hit = true; st.ball.v = 280; st.ball.rest = 0; rollBall(); } },
    end(st){ Object.assign(st.feet.R, this.f0, { lift: 0 }); st.sway = 0; } }]);
}

// pick up: crouch, lean, neck down and head straight down; the neck angle is solved so the beak meets a block on the floor
function pickPose(st){
  const HEAD = Math.PI/3;   // the head ends up tipped 60 degrees nose-down
  const tryNp = np => { const s2 = { ...st, cr: 1.15, tp: .6, np, hp: HEAD - .6 - np, sit: 0, sway: 0, bob: 0 };
    return fpt(headGeo(s2, torsoFrame(s2)).F2, GRASP); };
  let lo = .4, hi = 2.1; for (let i = 0; i < 24; i++){ const mid = (lo + hi)/2; if (tryNp(mid)[2] > BLK) lo = mid; else hi = mid; }
  const np = (lo + hi)/2; return { cr: 1.15, tp: .6, np, hp: HEAD - .6 - np, at: tryNp(np) };
}
const REACH_IDS = [1,2,3,6,7,8,11,12,15];
function pick(st){
  if (onSkates(st)) return ui.flash('Take the skates off first');
  const pre = standFirst(st), up = poseMove(1.4, REACH_IDS, { cr: 0, tp: 0, np: 0, hp: 0, hy: 0, hr: 0 });
  if (st.block && st.block.held){   // put it down where the beak reaches, then let go
    const down = Object.assign(poseMove(1.6, REACH_IDS, { cr: 1.15, tp: .6, np: 1, hp: 0, mu: .22 }), { begin(st){ const p = pickPose(st); this.a = {}; this.to = p;
      for (const k of ['cr','tp','np','hp','mu','hy','hr']) this.a[k] = st[k] || 0; },
      upd(st, k){ const e = ease(k); for (const q of ['cr','tp','np','hp']) st[q] = mLerp(this.a[q], this.to[q], e); st.hy = mLerp(this.a.hy, 0, e); st.hr = mLerp(this.a.hr, 0, e); } });
    const open = poseMove(.4, [15], { mu: .5 }, st => { const g = fpt(headGeo(st, torsoFrame(st)).F2, GRASP); Object.assign(st.block, { held: false, x: g[0], y: g[1], th: st.th }); });
    return queue(st, [...pre, down, open, up, poseMove(.3, [15], { mu: 0 })]);
  }
  const down = { dur: 1.6, ids: REACH_IDS, begin(st){ const p = pickPose(st); this.to = p; this.a = {};
      for (const k of ['cr','tp','np','hp','mu','hy','hr']) this.a[k] = st[k] || 0;
      st.block = { x: p.at[0], y: p.at[1], th: st.th, held: false, a: 1 }; },
    upd(st, k){ const e = ease(k); for (const q of ['cr','tp','np','hp']) st[q] = mLerp(this.a[q], this.to[q], e);
      st.mu = mLerp(this.a.mu, .5, e); st.hy = mLerp(this.a.hy, 0, e); st.hr = mLerp(this.a.hr, 0, e); } };
  const bite = poseMove(.35, [15], { mu: .22 }, st => { st.block.held = true; });
  queue(st, [...pre, down, bite, up]);
}

// every duck makes up its own voice the first time it wakes up: here, a new one for every visit
const VOICE = { f: 360 + Math.random()*460, q: 2.5 + Math.random()*5, wob: 10 + Math.random()*32, len: .11 + Math.random()*.1, type: ['sawtooth', 'square', 'triangle'][Math.random()*3 | 0] };
let AC = null;
function quackSound(n = 2){ try {
  AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume();
  for (let i = 0; i < n; i++){ const t = AC.currentTime + .02 + i*(VOICE.len + .13);
    const o = AC.createOscillator(), g = AC.createGain(), bp = AC.createBiquadFilter(), lfo = AC.createOscillator(), lg = AC.createGain();
    o.type = VOICE.type; o.frequency.setValueAtTime(VOICE.f*1.25, t); o.frequency.exponentialRampToValueAtTime(VOICE.f*.7, t + VOICE.len);
    lfo.frequency.value = VOICE.wob; lg.gain.value = VOICE.f*.06; lfo.connect(lg); lg.connect(o.frequency);
    bp.type = 'bandpass'; bp.frequency.value = VOICE.f*2.2; bp.Q.value = VOICE.q;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.3, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + VOICE.len + .05);
    o.connect(bp); bp.connect(g); g.connect(AC.destination); o.start(t); lfo.start(t); o.stop(t + VOICE.len + .08); lfo.stop(t + VOICE.len + .08); }
} catch (e) {} }
function quack(st){
  const full = st.block && st.block.held;
  queue(st, [{ dur: 1.15, ids: full ? [11] : [11, 15], begin(st){ this.h = st.hp; this.m = st.mu; quackSound(full ? 1 : 2); ui.flash(full ? 'Mmf! (mouth full)' : 'Quack quack! Every duck gets its own voice', 1600); },
    upd(st, k){ if (!full) st.mu = .5*Math.abs(Math.sin(2*Math.PI*k)); st.hp = this.h - .16*Math.sin(Math.PI*k); },
    end(st){ st.mu = this.m; st.hp = this.h; } }]);
}

const TOUR = [
  { name:'Open it up', xr:1, focus:null, lit:false, pause:2600, loop: st => look(st),

  { name:'The brain', xr:1, focus:['MAIN BOARD','BODY IMU','HIP PITCH','KNEE','ANKLE'], lit:false, pause:400, loop: st => tourWalk(st),
    say:'The brain is a Rockchip RK3566 board with a small AI accelerator. 50 times a second it reads the sensors, runs the walking policy and sends new targets to the motors.',
    stats: st => [{ label:'Policy steps', value:Math.floor(st.policyN || 0).toLocaleString('en-US') }, { label:'Loop', value:'50 Hz', small:true }, { label:'Chip', value:'RK3566', small:true }] },
  { name:'The eyes', xr:1, focus:['CAMERA','8×8 TOF','HEAD IMU','HEAD YAW','HEAD PITCH','HEAD ROLL'], lit:false, pause:700, loop: st => look(st),
    say:'In the head: a front camera, with a light that shows when it is on, and an 8×8 time-of-flight sensor, a tiny lidar that measures 64 distances at once. Four motors aim them.',
    stats: st => [{ label:'Depth points', value:'64' }, { label:'Grid', value:'8 × 8', small:true }, { label:'Head motors', value:'4', small:true }] },
  { name:'The battery', xr:1, focus:['NP-F550 BATTERY','POWER BOARD'], lit:true, pause:1600, loop: st => sitStand(st),
    say:'Power comes from a removable 2,600 mAh NP-F550, the camera battery many video lights use. About an hour of play, then swap in a fresh one.',
    stats: st => [{ label:'Battery', value:'2,600 mAh' }, { label:'Runtime', value:'≈ 1 h', small:true }, { label:'Type', value:'NP-F550', small:true }] },
  { name:'How it learned', xr:0, focus:[], lit:false, pause:900, loop: st => learn(st),
    say:'Nobody hand-wrote this walk. In the MuJoCo simulator, 4,096 virtual ducks practise at once: they fall, try again and slowly get better (reinforcement learning with PPO). An hour or two on one GPU gives a usable gait, which is then loaded onto the real duck.',
    stats: st => [{ label:'Virtual ducks', value:'4,096' }, { label:'Stage', value: st.stage || 'Early training', small:true }, { label:'Training', value:'≈ 1–2 h', small:true }] },
];
const BUILD_N = 4;
// walk a few steps forward, then back, so the duck stays in frame
function tourWalk(st){ st.tourDir = -(st.tourDir || -1); walk(st, st.tourDir); }
// a shove from one side: the body is pushed over, the IMUs feel it, a foot steps out to catch the fall
function push(st){
  const s = (st.pushSide = -(st.pushSide || 1));
  queue(st, [{ dur: .9, ids: [1,4,5,6,9,10], begin(st){ st.pushes = (st.pushes || 0) + 1; },
    upd(st, k){ st.sway = s*14*Math.sin(Math.PI*Math.min(1, k*1.25))*(k < .8 ? 1 : 1 - (k - .8)*2.5); st.bob = -3*Math.sin(Math.PI*k); },
    end(st){ st.sway = 0; st.bob = 0; const ft = st.feet[s > 0 ? 'L' : 'R']; ft.y += s*7; ft.x += 3; } },
    stepMove(0, 'settle', 0), stepMove(0, 'settle', 0)]);
}
// training, as an illustration: early on the duck falls at once, later it manages a step or two, in the end it walks
const fall = () => ({ dur: .8, ids: [], upd(st, k){ st.fall = 82*k*k; } });
const fade = (to) => ({ dur: .45, ids: [], begin(st){ this.a = st.fade || 0; }, upd(st, k){ st.fade = mLerp(this.a, to, k); } });
// back on its feet in the middle for the next try (the queue keeps going, so no resetPose here)
const again = () => ({ dur: .01, ids: [], begin(st){ Object.assign(st, { bx: CX, by: CY, th: 0, sway: 0, bob: 0, fall: 0, fade: 1 });
  st.feet = { L: { ...nominal(st, 1), lift: 0 }, R: { ...nominal(st, -1), lift: 0 } }; }, upd(){} });
function learn(st){
  const n = st.tries = (st.tries || 0) + 1, phase = n % 3;
  const label = s => ({ dur: .01, ids: [], begin(st){ st.stage = s; ui.drawStats(); }, upd(){} });
  if (phase === 1) queue(st, [label('Early: falls at once'), fall(), fade(1), again(), fade(0)]);
  else if (phase === 2) queue(st, [label('Later: a step, then a fall'), stepMove(1, 'walk', 1), stepMove(-1, 'walk', 1), fall(), fade(1), again(), fade(0)]);
  else queue(st, [label('Trained: walks'), ...[1, -1, 1, -1].map(s => stepMove(s, 'walk', 1)), stepMove(0, 'settle', 0),
    ...[1, -1, 1, -1].map(s => stepMove(s, 'walk', -1)), stepMove(0, 'settle', 0), fade(1), again(), fade(0)]);
}
// a falling duck tips over its feet and fades; the rest of the scene is drawn as usual
function tourScene(st, m){
  const s = scene(st, m);
  if (!st.fall && !st.fade) return s;
  const p = P(st.bx + 18*Math.cos(st.th), st.by + 18*Math.sin(st.th), 0);
  return `<g style="opacity:${(1 - (st.fade || 0)).toFixed(3)}"><g transform="rotate(${(st.fall || 0).toFixed(2)} ${p[0].toFixed(1)} ${p[1].toFixed(1)})">${s}</g></g>`;
}
function tourStats(st){ const C = TOUR[st.tour - 1]; return [{ label:'Chapter', value:`${st.tour} / ${TOUR.length}` }, ...C.stats(st)]; }
function startChapter(st, i){
  const C = TOUR[i - 1];
  st.tourOn = true; st.tour = i;
  resetPose(st); st.fall = st.fade = 0; st.stage = ''; st.tries = 0; st.tourDir = -1;
  window.SLOWMO = C.slow || 1;
  st.focus = C.focus; st.focusLit = C.lit;
  const xb = document.getElementById('xrb'); if (xb && !!st.xrT !== !!C.xr) xb.click();
  setLabels(C.focus === null || C.focus.length > 0);
  st.tourNext = performance.now() + 700; st.tourBusy = false;
  tourCaption(st); ui.render();
}
function stopTour(st){
  st.tourOn = false; window.SLOWMO = 1; st.focus = null; resetPose(st); st.fall = st.fade = 0;
  const xb = document.getElementById('xrb'); if (xb && st.xrT) xb.click();
  setLabels(false); tourCaption(st);
}
function setMode(v){
  const st = ui.st;
  if (v === 'tour'){ if (st.view !== 'play') setView(st, 'play'); startChapter(st, st.tour || 1); }
  else { if (st.tourOn) stopTour(st); setView(st, v); }
  ui.render();
}
// the chapter text, under the figure
let tourCapEl = null;
function tourCaption(st){
  if (!tourCapEl){ tourCapEl = document.createElement('p'); tourCapEl.className = 'tourcap'; const sg = document.querySelector('.stage'); if (sg) sg.after(tourCapEl); }
  if (!st.tourOn){ tourCapEl.hidden = true; return; }
  const C = TOUR[st.tour - 1]; tourCapEl.hidden = false;
  tourCapEl.innerHTML = `<b>${st.tour}. ${C.name}</b>${C.say}`;
}
// the chapter's demo keeps going on its own: when the duck is idle, wait a moment, then play it again
setInterval(() => { const st = ui && ui.st; if (!st || !st.tourOn) return;
  const C = TOUR[st.tour - 1], now = performance.now(), busy = !!st.cur || st.queue.length > 0;
  if (st.tour === 4){ const t = now/1000; if (st.lastT) st.policyN = (st.policyN || 0) + 50*(t - st.lastT); st.lastT = t; ui.drawStats(); } else st.lastT = 0;
  if (busy){ st.tourBusy = true; return; }
  if (st.tourBusy){ st.tourBusy = false; st.tourNext = now + C.pause / (C.slow || 1); return; }
  if (now < st.tourNext) return;
  st.tourNext = now + 400; C.loop(st);
}, 100);

}
