# Builds Desktop Microduck for Apple Silicon and Intel Macs and attaches both zips to a GitHub release.
# Runs when a version tag (v0.1.0, v0.2.0, ...) is pushed, or by hand from the Actions tab.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the packager
        run: npm install --no-audit --no-fund
      - name: Package for both chips
        run: node tools/package.js
      - name: Sign ad hoc and zip
        run: |
          cd dist
          for a in arm64 x64; do
            codesign --force --deep -s - "Desktop Microduck-darwin-$a/Desktop Microduck.app"
          done
          ditto -c -k --sequesterRsrc --keepParent "Desktop Microduck-darwin-arm64/Desktop Microduck.app" Desktop-Microduck-mac-apple-silicon.zip
          ditto -c -k --sequesterRsrc --keepParent "Desktop Microduck-darwin-x64/Desktop Microduck.app" Desktop-Microduck-mac-intel.zip
          ls -la *.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Desktop Microduck ${TAG#v}" --notes-file .github/release-notes.md --target "$GITHUB_SHA"
          gh release upload "$TAG" dist/Desktop-Microduck-mac-apple-silicon.zip dist/Desktop-Microduck-mac-intel.zip --clobber
